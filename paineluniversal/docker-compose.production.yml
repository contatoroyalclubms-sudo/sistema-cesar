version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: paineluniversal
      POSTGRES_USER: painel_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Performance otimizations for high load
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_MAINTENANCE_WORK_MEM: 64MB
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: 0.9
      POSTGRES_WAL_BUFFERS: 16MB
      POSTGRES_DEFAULT_STATISTICS_TARGET: 100
      POSTGRES_RANDOM_PAGE_COST: 1.1
      POSTGRES_EFFECTIVE_IO_CONCURRENCY: 200
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    # Resource limits for 50k+ users
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    # Connection pooling ready
    command: >
      postgres 
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painel_user -d paineluniversal"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Read replica for scaling
  postgres-replica:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: painel_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: painel_user
      POSTGRES_DB: paineluniversal
      POSTGRES_MASTER_SERVICE: postgres
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    command: >
      redis-server 
      --maxmemory 512mb 
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
      --tcp-backlog 511
      --databases 16
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Multiple FastAPI instances for load balancing
  fastapi-backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    environment: &backend-env
      - DATABASE_URL=postgresql://painel_user:${POSTGRES_PASSWORD}@postgres:5432/paineluniversal
      - DATABASE_READ_URL=postgresql://painel_user:${POSTGRES_PASSWORD}@postgres-replica:5432/paineluniversal
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - WORKERS=4
      - MAX_CONNECTIONS=100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      replicas: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  fastapi-backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Multiple MEEP service instances
  meep-service-1:
    build:
      context: ./meep-service
      dockerfile: Dockerfile.production
    environment: &meep-env
      - DATABASE_URL=postgresql://painel_user:${POSTGRES_PASSWORD}@postgres:5432/paineluniversal
      - DATABASE_READ_URL=postgresql://painel_user:${POSTGRES_PASSWORD}@postgres-replica:5432/paineluniversal
      - REDIS_URL=redis://redis:6379
      - API_RECEITA_FEDERAL_URL=${API_RECEITA_FEDERAL_URL}
      - API_RECEITA_TOKEN=${API_RECEITA_TOKEN}
      - CPF_SALT=${CPF_SALT}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - UV_THREADPOOL_SIZE=16
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.3'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  meep-service-2:
    build:
      context: ./meep-service
      dockerfile: Dockerfile.production
    environment: *meep-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.3'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Frontend with Nginx serving
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_MEEP_API_URL=${VITE_MEEP_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    depends_on:
      - fastapi-backend-1
      - fastapi-backend-2
      - meep-service-1
      - meep-service-2
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # High-performance Nginx load balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - fastapi-backend-1
      - fastapi-backend-2
      - meep-service-1
      - meep-service-2
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis Sentinel for high availability
  redis-sentinel:
    image: redis:7-alpine
    command: >
      redis-sentinel /etc/redis-sentinel/sentinel.conf
      --sentinel announce-ip ${REDIS_SENTINEL_IP:-127.0.0.1}
      --sentinel announce-port 26379
    ports:
      - "26379:26379"
    volumes:
      - ./redis/sentinel.conf:/etc/redis-sentinel/sentinel.conf
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
    driver: local
  postgres_replica_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Production scaling settings
x-deploy-production: &deploy-production
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 120s