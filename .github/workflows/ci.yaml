name: CI - Validação de Contrato API NIP

on:
  push:
    branches: [ main, develop, sistema-v4-atualisado ]
  pull_request:
    branches: [ main, develop ]

jobs:
  contract-validation:
    name: 🔍 Validação de Contrato
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Instalar dependências Python
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml requests pytest pytest-asyncio httpx
        
    - name: 🔧 Setup Node.js para Spectral
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 📦 Instalar Spectral
      run: |
        npm install -g @stoplight/spectral-cli
        
    - name: 🔍 Validar OpenAPI com Spectral
      run: |
        if [ -f "spec/openapi_nip_full.yaml" ]; then
          echo "🔍 Executando Spectral lint..."
          spectral lint spec/openapi_nip_full.yaml -r spec/spectral_nip_rules.yaml --fail-severity error
        else
          echo "⚠️ Arquivo spec/openapi_nip_full.yaml não encontrado"
          exit 1
        fi
        
    - name: 🐍 Verificação customizada de contrato
      run: |
        if [ -f "scripts/verify_contract.py" ]; then
          echo "🔍 Executando verificador customizado..."
          python scripts/verify_contract.py spec/openapi_nip_full.yaml
        else
          echo "⚠️ Script verify_contract.py não encontrado"
          exit 1
        fi

  smoke-tests:
    name: 🧪 Smoke Tests
    runs-on: ubuntu-latest
    needs: contract-validation
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
        
    - name: 🧪 Executar smoke tests
      run: |
        if [ -f "tests/smoke/test_routes.py" ]; then
          echo "🧪 Executando smoke tests..."
          pytest tests/smoke/test_routes.py -v --tb=short
        else
          echo "⚠️ Smoke tests não encontrados"
          exit 1
        fi
      env:
        PYTHONPATH: .

  code-generation:
    name: 🏗️ Geração de Código
    runs-on: ubuntu-latest
    needs: contract-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Java (para OpenAPI Generator)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        
    - name: 📦 Instalar OpenAPI Generator
      run: |
        curl -Lo openapi-generator-cli.jar https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.8.0/openapi-generator-cli-7.8.0.jar
        
    - name: 🏗️ Gerar stubs FastAPI
      run: |
        if [ -f "spec/openapi_nip_full.yaml" ]; then
          echo "🏗️ Gerando stubs FastAPI..."
          java -jar openapi-generator-cli.jar generate \
            -i spec/openapi_nip_full.yaml \
            -g python-fastapi \
            -o generated/ \
            --additional-properties=packageName=nip_api,projectName=nip-api
        else
          echo "⚠️ Spec OpenAPI não encontrado"
          exit 1
        fi
        
    - name: 📦 Criar artefato dos stubs
      uses: actions/upload-artifact@v4
      with:
        name: generated-fastapi-stubs
        path: generated/
        retention-days: 30

  postman-collection:
    name: 📬 Atualizar Coleção Postman
    runs-on: ubuntu-latest
    needs: contract-validation
    if: github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 📦 Instalar openapi-to-postman
      run: |
        npm install -g openapi-to-postmanv2
        
    - name: 📬 Gerar coleção Postman
      run: |
        if [ -f "spec/openapi_nip_full.yaml" ]; then
          echo "📬 Gerando coleção Postman..."
          openapi2postmanv2 -s spec/openapi_nip_full.yaml -o postman_collection_nip_full.json \
            --pretty \
            --options-short-request-timeout 30000 \
            --options-folder-strategy Tags
        else
          echo "⚠️ Spec OpenAPI não encontrado"
          exit 1
        fi
        
    - name: 📦 Commit coleção Postman (se alterada)
      run: |
        if [ -f "postman_collection_nip_full.json" ]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add postman_collection_nip_full.json
          git diff --staged --quiet || git commit -m "chore: atualizar coleção Postman [skip ci]"
          git push
        fi

  security-scan:
    name: 🔒 Scan de Segurança
    runs-on: ubuntu-latest
    needs: contract-validation
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🔒 Executar Bandit (Python Security)
      run: |
        pip install bandit
        bandit -r app/ -f json -o bandit-report.json || true
        
    - name: 🔒 Executar Safety (dependências)
      run: |
        pip install safety
        safety check --json --output safety-report.json || true
        
    - name: 📦 Upload relatórios de segurança
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  documentation:
    name: 📚 Gerar Documentação
    runs-on: ubuntu-latest
    needs: contract-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 📦 Instalar Redocly
      run: |
        npm install -g @redocly/cli
        
    - name: 📚 Gerar documentação HTML
      run: |
        if [ -f "spec/openapi_nip_full.yaml" ]; then
          echo "📚 Gerando documentação com Redocly..."
          redocly build-docs spec/openapi_nip_full.yaml --output docs/api.html
        else
          echo "⚠️ Spec OpenAPI não encontrado"
          exit 1
        fi
        
    - name: 🚀 Deploy para GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs