openapi: 3.1.0
info:
  title: MEEP Clone API
  version: 3.0.0
  description: 'Patch Plan — Primeira leva (Auth, Empresas, Usuários, Eventos, Clientes,
    PDV, Ingressos, Financeiro). Padrões aplicados: RESTful, JWT bearer, paginação,
    erros tipados, idempotência em operações financeiras, webhooks como POST, versionamento
    /api/v1.

    '
servers:
- url: https://api.seudominio.com/api/v1
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErrorResponse:
      description: Erro padrão
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details:
                    type: object
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
    SortParam:
      name: sort
      in: query
      schema:
        type: string
    QueryParam:
      name: q
      in: query
      schema:
        type: string
    DateFromParam:
      name: date_from
      in: query
      schema:
        type: string
        format: date-time
    DateToParam:
      name: date_to
      in: query
      schema:
        type: string
        format: date-time
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
  schemas:
    Empresa:
      type: object
      required:
      - nome
      properties:
        id:
          type: integer
        nome:
          type: string
        cnpj:
          type: string
        status:
          type: string
          enum:
          - ativo
          - inativo
    Usuario:
      type: object
      required:
      - nome
      - email
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
          format: email
        perfil:
          type: string
        status:
          type: string
          enum:
          - ativo
          - inativo
    Evento:
      type: object
      required:
      - nome
      - data_inicio
      properties:
        id:
          type: integer
        nome:
          type: string
        data_inicio:
          type: string
          format: date-time
        data_fim:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ativo
          - cancelado
          - encerrado
          - rascunho
    Cliente:
      type: object
      required:
      - nome
      properties:
        id:
          type: integer
        nome:
          type: string
        cpf:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        categoria_id:
          type: integer
    Produto:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        preco:
          type: number
          format: float
        categoria_id:
          type: integer
        estoque_atual:
          type: number
    Venda:
      type: object
      properties:
        id:
          type: integer
        total:
          type: number
          format: float
        forma_pagamento:
          type: string
        itens:
          type: array
          items:
            type: object
            properties:
              produto_id:
                type: integer
              quantidade:
                type: number
              preco_unitario:
                type: number
                format: float
